<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams Timecards Self Tests</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="common.css" />
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
    integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ" crossorigin="anonymous"></script>
  <script type="module" src="test.js"></script>
</head>

<body data-page="test">
  <header>
    <h1>Teams Timecards Tests</h1>
    <span id="test-auth-status">Checking sign-in…</span>
    <button class="btn btn-primary" id="btn-test-signin" hidden>Sign in</button>
    <button class="btn btn-secondary" id="btn-test-signout" title="Signs out of this app only" hidden>Sign out</button>
  </header>

  <div id="error-banner"></div>

  <main class="test-shell">
    <div class="test-meta" id="test-meta"></div>
    <div class="test-summary" id="test-summary"></div>
    <div id="test-results"></div>
  </main>

  <div id="toast-area"></div>
</body>

</html>
