<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app's timeline in small: a card's bar with a break, its handles, and the now line. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232842" />
      <stop offset="1" stop-color="#0f1117" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b96ff" />
      <stop offset="1" stop-color="#5563ea" />
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#d68f2d" />
      <rect width="3" height="6" fill="#f5b04f" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <g stroke="#ffffff" stroke-opacity=".08" stroke-width="1">
    <path d="M16 10v44M32 10v44M48 10v44" />
  </g>
  <rect x="7" y="21" width="38" height="22" fill="#5563ea" opacity=".55" filter="url(#glow)" />
  <rect x="7" y="21" width="38" height="22" fill="url(#bar)" />
  <rect x="23" y="25" width="11" height="14" fill="url(#hatch)" />
  <g fill="#ffffff">
    <rect x="5.5" y="16" width="3" height="32" />
    <rect x="43.5" y="16" width="3" height="32" />
  </g>
  <rect x="51" y="13" width="3" height="41" rx="1.5" fill="#e05c6a" />
  <circle cx="52.5" cy="13" r="5" fill="#e05c6a" />
</svg>
