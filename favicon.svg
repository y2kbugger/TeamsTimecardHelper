<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Three days' worked bars and the now line: the app's week in small, bold enough to read at
       16 pixels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d88ff" />
      <stop offset="1" stop-color="#3f4bd6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <g fill="#ffffff">
    <rect x="10" y="14" width="24" height="10" rx="5" />
    <rect x="20" y="27" width="22" height="10" rx="5" />
    <rect x="13" y="40" width="20" height="10" rx="5" fill-opacity=".55" />
  </g>
  <rect x="47" y="9" width="6" height="46" rx="3" fill="#ffb547" />
</svg>
